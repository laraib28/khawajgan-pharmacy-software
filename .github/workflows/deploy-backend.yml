name: Deploy Backend to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Droplet via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            cd /home/ubuntu/pharmacy-software-khawajgan
            git fetch origin main
            git reset --hard origin/main
            cd backend
            source .venv/bin/activate
            pip install -r requirements.txt --quiet
            alembic upgrade head
            pgrep -f "gunicorn.*app.main:app" | xargs -r kill -TERM || true
            sleep 3
            nohup /home/ubuntu/pharmacy-software-khawajgan/backend/.venv/bin/gunicorn \
              -w 1 -k uvicorn.workers.UvicornWorker \
              --bind 127.0.0.1:8000 \
              --access-logfile /home/ubuntu/pharmacy-software-khawajgan/backend/gunicorn-access.log \
              --error-logfile /home/ubuntu/pharmacy-software-khawajgan/backend/gunicorn-error.log \
              app.main:app > /dev/null 2>&1 &
            disown $!
            sleep 2
            echo "✅ Deployment complete"
